name: Pinnwand
version: "1.0.0"
slug: pinnwand
description: Deine eigene digitale Pinnwand, läuft direkt auf diesem Home Assistant
url: https://github.com/Wurstgulasch84/pinnwand
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ports:
  3190/tcp: 3190
ports_description:
  3190/tcp: Pinnwand im Browser
webui: http://[HOST]:[PORT:3190]
map:
  - addon_config:rw
backup_exclude:
  - "app"
options:
  github_token: ""
  branch: main
  public_url: ""
  link_previews: true
  max_upload_mb: 20
schema:
  github_token: password
  branch: str
  public_url: str?
  link_previews: bool
  max_upload_mb: int(1,500)
