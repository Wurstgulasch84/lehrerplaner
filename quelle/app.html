<title>Lehrerplaner Sachsen</title>

<style>
/* Layout: App-Hülle. Ab 900px Seitenleiste links, darunter Leiste unten (Daumenreichweite). Farben aus dem PDF-Planer übernommen. */
:root{
  --bg:#F2F4F7;--surface:#FFFFFF;--ink:#2B2D42;--muted:#646B7E;--line:#DCE0E7;--soft-line:#ECEEF2;
  --accent:#3D6B8E;--accent-ink:#FFFFFF;--accent-soft:#E3ECF3;
  --ferien:#DDF0E4;--ferien-t:#2B7048;--feier:#F9E0DC;--feier-t:#AE4033;--frei:#FDF0D2;--frei-t:#855A0C;--we:#EAECF0;
  --chalk:#2F4A3C;--chalk-t:#F2F5EF;--warn:#AE4033;--ok:#2B7048;
  --f-display:"Bitter",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171D;--surface:#1D2129;--ink:#E5E8EF;--muted:#9CA3B4;--line:#2F3541;--soft-line:#262B35;
  --accent:#86B3D6;--accent-ink:#10202D;--accent-soft:#223448;
  --ferien:#1B3527;--ferien-t:#86D0A4;--feier:#43221E;--feier-t:#F2A095;--frei:#3B2F17;--frei-t:#E6C06E;--we:#1A1E25;
  --chalk:#28402F;--chalk-t:#E8EFE6;--warn:#F2A095;--ok:#86D0A4;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171D;--surface:#1D2129;--ink:#E5E8EF;--muted:#9CA3B4;--line:#2F3541;--soft-line:#262B35;
  --accent:#86B3D6;--accent-ink:#10202D;--accent-soft:#223448;
  --ferien:#1B3527;--ferien-t:#86D0A4;--feier:#43221E;--feier-t:#F2A095;--frei:#3B2F17;--frei-t:#E6C06E;--we:#1A1E25;
  --chalk:#28402F;--chalk-t:#E8EFE6;--warn:#F2A095;--ok:#86D0A4;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.55rem;line-height:1.2}
h2{font-size:1.1rem}
h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
.app{min-height:100%}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .brand{display:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:8px 2px 7px;font-size:.72rem;color:var(--muted);cursor:pointer}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
main{padding-inline:16px;padding-block:18px 104px;max-width:1040px;margin-inline:auto}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:210px minmax(0,1fr)}
  .nav{position:sticky;top:0;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:20px 12px;gap:4px;bottom:auto}
  .nav .brand{display:block;font-family:var(--f-display);font-weight:700;font-size:1.05rem;padding:0 10px 4px}
  .nav .brand small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.8rem;margin-top:2px}
  .nav .sep{height:14px}
  .nav button{flex:0;flex-direction:row;gap:10px;font-size:.95rem;padding:9px 10px;border-radius:8px;justify-content:flex-start}
  .nav button[aria-current="page"]{background:var(--accent-soft)}
  main{padding-inline:32px;padding-block:28px 48px}
}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.head .sub{color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;line-height:1.2;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.quiet{border-color:transparent;background:none;color:var(--accent)}
.btn.danger{color:var(--warn)}
.btn.sq{width:38px;padding:0;font-size:1.2rem}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.cal td button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-height:38px;width:100%}
textarea{resize:vertical;min-height:70px;line-height:1.4}
input.inline,textarea.inline{border-color:transparent;background:transparent;padding-inline:4px}
input.inline:hover,textarea.inline:hover{border-color:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}

.stack{display:grid;gap:14px}
.cols{display:grid;gap:14px}

.st-wochenende{background:var(--we);color:var(--muted)}
.note{background:var(--frei);color:var(--frei-t);border-radius:var(--r);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:14px}
.note p{margin:0}
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count b{font-family:var(--f-display);font-size:2rem;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.lessons{display:grid}
.lesson{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;padding:10px 0;border-top:1px solid var(--soft-line)}
.lesson:first-child{border-top:0;padding-top:2px}
.lesson .n{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.1}
.lesson .n small{display:block;font-family:var(--f-body);font-weight:400;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lesson .what{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.lesson .what strong{font-size:1.02rem}
.lesson.empty{opacity:.55;padding-block:6px}
.lesson textarea{min-height:52px;margin-top:4px}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.tasks li{display:flex;align-items:center;gap:6px}
.tasks li.done input[type=text]{text-decoration:line-through;color:var(--muted)}

.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;width:32px;height:32px;border-radius:6px;flex:none}

.addrow{display:flex;gap:6px;margin-top:8px}
.week{display:grid;gap:10px}
@media (min-width:760px){.week{grid-template-columns:repeat(5,minmax(0,1fr))}}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;align-content:start;text-align:left;cursor:pointer}

.wday.is-today{box-shadow:inset 0 0 0 2px var(--accent)}
.wday .dh{display:flex;justify-content:space-between;align-items:baseline;gap:6px}

.wl{font-size:.88rem;display:grid;grid-template-columns:20px minmax(0,1fr);gap:4px;border-top:1px solid var(--soft-line);padding-top:5px}
.wl .t{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;margin-bottom:14px;align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}
.months{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.cal{width:100%;border-collapse:separate;border-spacing:2px;font-variant-numeric:tabular-nums;table-layout:fixed}
.cal th{font-size:.7rem;color:var(--muted);font-weight:400}
.cal td{padding:0}
.cal td button{width:100%;aspect-ratio:1;max-width:100%;border:0;border-radius:6px;background:none;cursor:pointer;font-size:.85rem;position:relative;padding:0}
.cal td button.s-ferien{background:var(--ferien);color:var(--ferien-t)}
.cal td button.s-feiertag{background:var(--feier);color:var(--feier-t);font-weight:700}
.cal td button.s-frei{background:var(--frei);color:var(--frei-t);font-weight:700}
.cal td button.s-wochenende{background:var(--we);color:var(--muted)}
.cal td button.today{box-shadow:inset 0 0 0 2px var(--accent);font-weight:700}
.cal td button.has::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.kcard{text-align:left;cursor:pointer;display:grid;gap:4px}
.kcard:hover{border-color:var(--accent)}
.kcard b{font-family:var(--f-display);font-size:1.4rem}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:100%}
table.grid th,table.grid td{border-bottom:1px solid var(--soft-line);padding:4px 6px;text-align:left;vertical-align:middle}
table.grid th{font-size:.8rem;color:var(--muted);font-weight:700;white-space:nowrap}
table.grid td.c,table.grid th.c{text-align:center}
table.grid .sticky{position:sticky;left:0;background:var(--surface);z-index:1}
table.grid input.g{width:3.4em;text-align:center;padding:5px 2px;min-height:34px}
table.grid tfoot td{font-weight:700;border-bottom:0;padding-top:8px}
.avg{font-weight:700;font-family:var(--f-display)}
.srow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 0;border-top:1px solid var(--soft-line)}
.srow:first-child{border-top:0}
.srow .nr{color:var(--muted);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums}
.sfields{display:grid;gap:4px}
@media (min-width:600px){.sfields{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}}
.anw{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--soft-line)}
.anw:first-child{border-top:0}
.anw .state{min-width:150px;text-align:center}
.anw .state.e{background:var(--frei);color:var(--frei-t);border-color:transparent}
.anw .state.u{background:var(--feier);color:var(--feier-t);border-color:transparent}
.anw .state.v{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.anw .tot{grid-column:2 / -1;font-size:.8rem;color:var(--muted);margin-top:-4px}
.board{background:var(--chalk);color:var(--chalk-t);text-align:center;font-family:var(--f-display);letter-spacing:.2em;font-size:.85rem;padding:7px;border-radius:6px;margin-bottom:12px}
.seats{display:grid;gap:6px}
.seats select{font-size:.8rem;padding:6px 4px;min-height:44px;text-align:center}
.seats select.taken{background:var(--accent-soft);border-color:transparent;font-weight:700}
.menu{display:grid;gap:8px}
.menu button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.menu button span{display:grid}
.menu button small{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;min-height:38px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.prow{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:10px 0;border-top:1px solid var(--soft-line)}
.prow:first-of-type{border-top:0}
.pfields{display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.pfields{grid-template-columns:1fr 1fr 1.2fr 1.4fr .8fr}}
.pfields label{display:grid;gap:2px;font-size:.75rem;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px}
@media (min-width:700px){.checks{grid-template-columns:1fr 1fr;column-gap:24px}}
.checks label{display:flex;gap:8px;align-items:flex-start;padding:4px 0;cursor:pointer}
.checks input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.steps li{border-left:3px solid var(--accent-soft);padding-left:12px}
.steps b{color:var(--accent)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-variant-numeric:tabular-nums}
.confirm{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.confirm span{color:var(--warn);font-weight:700}
.form{display:grid;gap:8px}
@media (min-width:600px){.form.row{grid-template-columns:2fr 1.3fr 1fr auto;align-items:end}}
.form label{display:grid;gap:3px;font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.9rem;z-index:30}
@media (min-width:900px){.toast{bottom:24px}}
@media (prefers-reduced-motion:no-preference){.wday,.btn,.kcard{transition:border-color .15s}}
</style>

<script>
"use strict";
/* ---------------------------------------------------------- Kalender Sachsen 2026/27
   Quelle: Schuljahrestermine Freistaat Sachsen (schule.sachsen.de), Sächsisches Feiertagsgesetz.
   Gleiche Daten wie im PDF-Generator lehrerplaner.py. */
const FIRST = "2026-08-17", LAST = "2027-07-09";
const FERIEN = [
  ["Sommerferien", "2026-07-04", "2026-08-14"],
  ["Herbstferien", "2026-10-12", "2026-10-24"],
  ["Weihnachtsferien", "2026-12-23", "2027-01-02"],
  ["Winterferien", "2027-02-08", "2027-02-19"],
  ["Osterferien", "2027-03-26", "2027-04-02"],
  ["Pfingstferien", "2027-05-15", "2027-05-18"],
  ["Sommerferien", "2027-07-10", "2027-08-20"],
];
const FEIERTAGE = {
  "2026-10-03": "Tag der Deutschen Einheit", "2026-10-31": "Reformationstag",
  "2026-11-18": "Buß- und Bettag", "2026-12-25": "1. Weihnachtstag", "2026-12-26": "2. Weihnachtstag",
  "2027-01-01": "Neujahr", "2027-03-26": "Karfreitag", "2027-03-28": "Ostersonntag",
  "2027-03-29": "Ostermontag", "2027-05-01": "Tag der Arbeit", "2027-05-06": "Christi Himmelfahrt",
  "2027-05-16": "Pfingstsonntag", "2027-05-17": "Pfingstmontag",
};
const UNTERRICHTSFREI = { "2027-05-07": "Unterrichtsfrei (nach Himmelfahrt)" };
const HINWEISE = { "2027-05-27": "Fronleichnam (nur regional Feiertag)" };
const WT = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const WT2 = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const MON = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const MONTHS = [[2026, 8], [2026, 9], [2026, 10], [2026, 11], [2026, 12], [2027, 1], [2027, 2], [2027, 3], [2027, 4], [2027, 5], [2027, 6], [2027, 7]];

const pad = n => String(n).padStart(2, "0");
const D = s => { const [y, m, d] = s.split("-").map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const iso = dt => dt.toISOString().slice(0, 10);
const add = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const wd = s => (D(s).getUTCDay() + 6) % 7;
const monday = s => add(s, -wd(s));
const todayIso = () => { const n = new Date(); return n.getFullYear() + "-" + pad(n.getMonth() + 1) + "-" + pad(n.getDate()); };
const fmt = (s, year = true) => { const [y, m, d] = s.split("-").map(Number); return d + ". " + MON[m - 1] + (year ? " " + y : ""); };
const fmtShort = s => { const [, m, d] = s.split("-").map(Number); return d + "." + m + "."; };

function ferienName(s) { for (const [n, a, b] of FERIEN) if (a <= s && s <= b) return n; return null; }
function baseStatus(s) {
  if (FEIERTAGE[s]) return ["feiertag", FEIERTAGE[s]];
  if (UNTERRICHTSFREI[s]) return ["frei", UNTERRICHTSFREI[s]];
  const f = ferienName(s);
  if (f || s < FIRST || s > LAST) return ["ferien", f || "Sommerferien"];
  if (wd(s) >= 5) return ["wochenende", "Wochenende"];
  return ["schule", ""];
}
function status(s) {
  if (S && S.settings.bewegl === s && baseStatus(s)[0] === "schule") return ["frei", "Beweglicher Ferientag"];
  return baseStatus(s);
}
const SCHOOLDAYS = [];
for (let s = FIRST; s <= LAST; s = add(s, 1)) if (baseStatus(s)[0] === "schule") SCHOOLDAYS.push(s);
const DAYNO = Object.fromEntries(SCHOOLDAYS.map((s, i) => [s, i + 1]));
const WEEKS = [];
for (const s of SCHOOLDAYS) { const m = monday(s); if (WEEKS[WEEKS.length - 1] !== m) WEEKS.push(m); }
const WEEKNO = Object.fromEntries(WEEKS.map((m, i) => [m, i + 1]));
console.assert(SCHOOLDAYS.length === 196 && WEEKS.length === 41, SCHOOLDAYS.length, WEEKS.length);

function nextBreak(s) {
  for (const [n, a] of FERIEN) if (a > s) {
    let c = 0; for (const d of SCHOOLDAYS) if (d >= s && d < a) c++;
    return { name: n, start: a, days: c };
  }
  return null;
}

/* ---------------------------------------------------------- Daten */
const KEY = "lehrerplaner.sachsen.v1";
const ZEITEN = [["07:30", "08:15"], ["08:25", "09:10"], ["09:30", "10:15"], ["10:25", "11:10"], ["11:30", "12:15"], ["12:25", "13:10"], ["13:20", "14:05"], ["14:15", "15:00"]];
let S = null, storageOk = true;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function blank() {
  return { v: 1, beispiel: false, settings: { bewegl: "" }, zeiten: ZEITEN.map(z => z.slice()), plan: {}, klassen: {}, kOrder: [], tage: {}, check: {}, eigene: {} };
}
function newKlasse(name, fach) {
  return { name, fach, s: {}, sOrder: [], leist: {}, lOrder: [], noten: {}, fehl: {}, sitz: { rows: 5, cols: 8, seats: {} }, notizen: "" };
}
function sample() {
  const st = blank(); st.beispiel = true;
  const mk = (id, name, fach, names) => {
    const k = newKlasse(name, fach);
    names.forEach((n, i) => { const sid = id + "s" + i; k.s[sid] = { name: n, notiz: "" }; k.sOrder.push(sid); });
    st.klassen[id] = k; st.kOrder.push(id); return k;
  };

/* Noten: 1–6, mit + / − als Viertelnote, Komma erlaubt */
function gval(v) {
  if (v == null) return null;
  v = String(v).trim().replace(",", ".").replace("–", "-");
  const m = v.match(/^([1-6])\s*([+-])$/);
  if (m) return +m[1] + (m[2] === "+" ? -0.25 : 0.25);
  if (!/^\d(\.\d+)?$/.test(v)) return null;
  const n = parseFloat(v); return n >= 1 && n <= 6 ? n : null;
}
const fmtAvg = x => x == null ? "–" : x.toFixed(2).replace(".", ",");
function studentAvg(k, sid) {

  for (const l of k.lOrder) { const g = gval(k.noten[l] && k.noten[l][sid]); if (g != null) { const ww = +k.leist[l].gew || 1; s += g * ww; w += ww; } }
  return w ? s / w : null;
}
function leistAvg(k, l) {
  let s = 0, n = 0;
  for (const sid of k.sOrder) { const g = gval(k.noten[l] && k.noten[l][sid]); if (g != null) { s += g; n++; } }
  return n ? s / n : null;
}
function klasseAvg(k) {
  const xs = k.sOrder.map(sid => studentAvg(k, sid)).filter(x => x != null);

}

/* ---------------------------------------------------------- Abgleich über Dropbox
   Ende-zu-Ende verschlüsselt: Das Passwort bleibt auf den Geräten, in der Dropbox liegt nur Datensalat.
   Zusammenführen: Jeder einzelne Eintrag (Note, Thema, Fehltag …) trägt den Zeitpunkt seiner letzten Änderung,
   beim Abgleich gewinnt je Eintrag die neuere Änderung. So gehen Eingaben von zwei Geräten nicht verloren. */
const DROPBOX_KEY = "bnxxe9mel4043ad";                       /* App-Key der Dropbox-App, kann auch in der App eingetragen werden */
const DBX_FILE = "/lehrerplaner-daten.sync";
const SYNC_KEY = KEY + ".sync", STAMP_KEY = KEY + ".stamps", SHADOW_KEY = KEY + ".shadow";
let SY = {}, STAMPS = {}, SHADOW = null;
const SYNC = { state: "idle", msg: "" };
function lsGet(k, d) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const persistSync = () => lsSet(SYNC_KEY, SY);
const appKey = () => DROPBOX_KEY || SY.appKey || "";
const syncReady = () => !!(SY.refresh && SY.k && appKey());

function flatten(o, p = "", out = {}) {
  for (const k in o) {
    const v = o[k], q = p ? p + "|" + k : k;
    if (v && typeof v === "object" && !Array.isArray(v)) { if (Object.keys(v).length) flatten(v, q, out); else out[q] = "{}"; }
    else if (v !== undefined) out[q] = JSON.stringify(v);
  }
  return out;
}
function unflatten(flat) {
  const root = {};
  const keys = Object.keys(flat).sort((a, b) => a.split("|").length - b.split("|").length);
  for (const p of keys) {
    const ks = p.split("|"), v = JSON.parse(flat[p]); let o = root;
    for (let i = 0; i < ks.length - 1; i++) { if (!o[ks[i]] || typeof o[ks[i]] !== "object" || Array.isArray(o[ks[i]])) o[ks[i]] = {}; o = o[ks[i]]; }
    const last = ks[ks.length - 1];
    if (v && typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length && o[last] && typeof o[last] === "object") continue;
    o[last] = v;
  }
  return root;
}
/* Unterschiede seit dem letzten Speichern mit Zeitstempel versehen */
function stamp() {
  const flat = flatten(S), now = Date.now(), old = SHADOW || {};
  let changed = false;
  for (const k in flat) if (old[k] !== flat[k]) { STAMPS[k] = [now, 0]; changed = true; }
  for (const k in old) if (!(k in flat)) { STAMPS[k] = [now, 1]; changed = true; }
  for (const k in STAMPS) if (STAMPS[k][1] && STAMPS[k][0] < now - 180 * 864e5) { delete STAMPS[k]; changed = true; }
  SHADOW = flat;
  if (changed) { lsSet(STAMP_KEY, STAMPS); lsSet(SHADOW_KEY, SHADOW); }
}
function merge(lf, ls, rf, rs) {
  const flat = {}, stamps = {};
  for (const k of new Set([...Object.keys(ls), ...Object.keys(rs)])) {
    const a = ls[k], b = rs[k], useR = b && (!a || b[0] > a[0]), s = useR ? b : a;
    stamps[k] = s;
    if (!s[1]) { const v = useR ? rf[k] : lf[k]; if (v !== undefined) flat[k] = v; }
  }
  return { flat, stamps };
}
function adoptFlat(flat, stamps) {
  S = Object.assign(blank(), unflatten(flat)); normalize();
  STAMPS = stamps; SHADOW = flat;
  saveLocal();
}
function applyRemote(remote) {
  stamp();
  const before = JSON.stringify(SHADOW);
  const m = merge(SHADOW, STAMPS, remote.flat, remote.stamps);
  adoptFlat(m.flat, m.stamps);
  const rs = remote.stamps, ks = Object.keys(STAMPS);
  const needUpload = ks.length !== Object.keys(rs).length || ks.some(k => !rs[k] || rs[k][0] !== STAMPS[k][0] || rs[k][1] !== STAMPS[k][1]);
  return { changed: JSON.stringify(SHADOW) !== before, needUpload };
}
const localIsEmpty = () => S.beispiel || (!S.kOrder.length && !Object.keys(S.tage).length && !Object.keys(S.plan).length);

/* Verschlüsselung: PBKDF2 (310.000 Runden) und AES-GCM 256 */
const te = new TextEncoder(), tdc = new TextDecoder();
function b64(buf) { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64url = buf => b64(buf).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
async function deriveKey(pw, salt) {
  const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 310000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]);
}
const importKey = raw => crypto.subtle.importKey("raw", unb64(raw), "AES-GCM", false, ["encrypt", "decrypt"]);
async function encryptPayload(obj) {
  const iv = rnd(12), key = await importKey(SY.k);
  const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(JSON.stringify(obj)));
  return JSON.stringify({ app: "lehrerplaner", v: 1, salt: SY.salt, iv: b64(iv), data: b64(data) });
}
async function decryptEnvelope(env, key) {
  try {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(env.iv) }, key, unb64(env.data));
    return JSON.parse(tdc.decode(plain));
  } catch (e) { throw Object.assign(new Error("Das Passwort passt nicht zur Datei in der Dropbox."), { kind: "pw" }); }
}

/* Dropbox: Anmeldung mit PKCE (kein Geheimnis im Code nötig), Zugriff nur auf den eigenen App-Ordner */
const redirectUri = () => location.origin + location.pathname.replace(/index\.html$/, "");
async function dbxLogin() {
  const verifier = b64url(rnd(48)), state = b64url(rnd(12));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", te.encode(verifier)));
  SY.pkce = { verifier, state }; persistSync();
  location.href = "https://www.dropbox.com/oauth2/authorize?" + new URLSearchParams({ client_id: appKey(), response_type: "code", code_challenge: challenge,
    code_challenge_method: "S256", token_access_type: "offline", redirect_uri: redirectUri(), state }).toString();
}
async function tokenCall(params) {

  catch (e) { throw Object.assign(new Error("Keine Internetverbindung."), { kind: "net" }); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error("Dropbox hat die Anmeldung abgelehnt. Bitte neu verbinden."), { kind: "auth" });

  const p = SY.pkce; delete SY.pkce;
  if (!p || p.state !== state) { persistSync(); throw new Error("Die Anmeldung ist abgelaufen. Bitte noch einmal verbinden."); }

async function token() {
  if (SY.token && SY.exp > Date.now() + 60000) return SY.token;
  await tokenCall({ grant_type: "refresh_token", refresh_token: SY.refresh });
  return SY.token;
}
async function dbx(url, opt) {
  for (let i = 0; i < 2; i++) {
    let r;
    try { r = await fetch(url, Object.assign({}, opt, { headers: Object.assign({ Authorization: "Bearer " + await token() }, opt.headers) })); }
    catch (e) { if (e.kind) throw e; throw Object.assign(new Error("Keine Internetverbindung."), { kind: "net" }); }
    if (r.status === 401 && i === 0) { SY.exp = 0; continue; }
    if (r.status === 401) throw Object.assign(new Error("Dropbox hat die Anmeldung abgelehnt. Bitte neu verbinden."), { kind: "auth" });
    return r;
  }
}
async function dbxDownload() {
  const r = await dbx("https://content.dropboxapi.com/2/files/download", { method: "POST", headers: { "Dropbox-API-Arg": JSON.stringify({ path: DBX_FILE }) } });
  if (r.status === 409) return null;
  if (!r.ok) throw Object.assign(new Error("Dropbox antwortet gerade nicht (" + r.status + ")."), { kind: "net" });
  const text = await r.text();
  let rev = null;
  try { rev = JSON.parse(r.headers.get("Dropbox-API-Result")).rev; } catch (e) {}
  if (!rev) {
    const m = await dbx("https://api.dropboxapi.com/2/files/get_metadata", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: DBX_FILE }) });
    rev = (await m.json()).rev;
  }
  return { text, rev };
}
async function dbxUpload(text, rev) {
  const mode = rev ? { ".tag": "update", update: rev } : { ".tag": "add" };
  const r = await dbx("https://content.dropboxapi.com/2/files/upload", { method: "POST",
    headers: { "Content-Type": "application/octet-stream", "Dropbox-API-Arg": JSON.stringify({ path: DBX_FILE, mode, autorename: false, mute: true }) }, body: text });
  if (r.status === 409) return false;   /* ein anderes Gerät war schneller: neu laden und noch einmal */
  if (!r.ok) throw Object.assign(new Error("Hochladen hat nicht geklappt (" + r.status + ")."), { kind: "net" });
  return true;
}

let syncing = false, syncAgain = false, syncT, pendingRender = false;
function syncSoon(ms = 4000) { if (!syncReady()) return; clearTimeout(syncT); syncT = setTimeout(sync, ms); }
function typing() { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox"; }
function refreshView() { if (typing()) pendingRender = true; else rerender(); }
async function sync() {
  if (!syncReady() || window.self !== window.top) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; SYNC.state = "run"; clearTimeout(saveT);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  try {
    for (let i = 0; i < 4; i++) {
      stamp();
      const rem = await dbxDownload();
      let need = true, changed = false;
      if (rem) {
        const env = JSON.parse(rem.text);
        if (env.salt !== SY.salt) throw Object.assign(new Error("In der Dropbox liegt eine Datei mit anderem Passwort. Bitte trennen und neu verbinden."), { kind: "pw" });
        const res = applyRemote(await decryptEnvelope(env, await importKey(SY.k)));
        need = res.needUpload; changed = res.changed;
      }
      if (changed) refreshView();
      if (!need || await dbxUpload(await encryptPayload({ flat: SHADOW, stamps: STAMPS }), rem && rem.rev)) {
        SY.last = Date.now(); persistSync(); SYNC.state = "ok"; SYNC.msg = ""; break;
      }
    }
  } catch (e) { SYNC.state = "err"; SYNC.kind = e.kind || "other"; SYNC.msg = e.message; }
  syncing = false;
  if (UI.view === "mehr" && UI.mehr === "sync") refreshView();
  if (syncAgain) { syncAgain = false; syncSoon(500); }
}
window.addEventListener("online", () => syncSoon(500));
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncSoon(300); });
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender && !typing()) { pendingRender = false; rerender(); } }, 50));
setInterval(() => { if (document.visibilityState === "visible") syncSoon(0); }, 120000);

function syncLabel() {
  if (!syncReady()) return "Dropbox, verschlüsselt";
  if (SYNC.state === "err") return SYNC.kind === "net" ? "Offline, wird nachgeholt" : "Bitte prüfen";
  if (!SY.last) return "Verbunden";
  const d = new Date(SY.last);
  return "Zuletzt abgeglichen " + (todayIsoOf(d) === todayIso() ? "heute" : "am " + fmtShort(todayIsoOf(d))) + " um " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + " Uhr";
}
const todayIsoOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());

async function checkRemote() {
  UI.remote = "check";
  try { UI.remote = (await dbxDownload()) || { none: true }; } catch (e) { UI.remote = { err: e.message }; }
  rerender();
}
async function setPassword(pw, pw2) {
  const r = UI.remote;
  if (r && r.text) {
    const env = JSON.parse(r.text);
    toast("Passwort wird geprüft …");
    const key = await deriveKey(pw, unb64(env.salt));
    let payload;
    try { payload = await decryptEnvelope(env, key); } catch (e) { toast(e.message); return; }
    SY.k = b64(await crypto.subtle.exportKey("raw", key)); SY.salt = env.salt; persistSync();
    if (localIsEmpty()) adoptFlat(payload.flat, payload.stamps); else applyRemote(payload);
  } else {
    if (pw.length < 8) { toast("Bitte mindestens 8 Zeichen"); return; }
    if (pw !== pw2) { toast("Die beiden Passwörter sind nicht gleich"); return; }
    const salt = rnd(16), key = await deriveKey(pw, salt);
    SY.k = b64(await crypto.subtle.exportKey("raw", key)); SY.salt = b64(salt); persistSync();
  }
  UI.remote = null; toast("Abgleich eingerichtet");
  render(); sync();
}
function renderSync(back) {
  const framed = window.self !== window.top;
  const head = `<div class="head"><div>${back}<h1>Geräte abgleichen</h1><div class="sub">PC, Tablet und Handy mit demselben Stand</div></div></div>`;
  const intro = `<section class="card"><h2>So funktioniert es</h2><p style="margin:0">Jedes Gerät speichert alles bei sich und funktioniert auch ohne Internet. Sobald Netz da ist, gleicht es sich über deine Dropbox ab. Dort liegt nur eine verschlüsselte Datei, die ohne dein Passwort niemand lesen kann, auch Dropbox nicht.</p></section>`;
  let body;
  if (framed) body = `<p style="margin:0">In dieser Vorschau geht der Abgleich nicht. Öffne die App über ihre eigene Adresse oder vom Startbildschirm.</p>`;
  else if (!appKey()) body = `<h2>Dropbox-App-Schlüssel</h2><form class="form" data-f="dbx-key"><label>App-Key aus der Dropbox-App-Konsole<input type="text" id="dbx-key" autocomplete="off" spellcheck="false"></label><div><button class="btn primary" type="submit">Speichern</button></div></form>`;
  else if (!SY.refresh) body = `<h2>Schritt 1: Dropbox verbinden</h2><p>Die App bekommt nur Zugriff auf ihren eigenen Ordner in deiner Dropbox, sonst auf nichts.</p><button class="btn primary" data-a="dbx-login">Mit Dropbox verbinden</button>`;
  else if (!SY.k) {
    if (!UI.remote) { setTimeout(checkRemote, 0); UI.remote = "check"; }
    if (UI.remote === "check") body = `<p class="muted" style="margin:0">Dropbox wird geprüft …</p>`;
    else if (UI.remote.err) body = `<p>${esc(UI.remote.err)}</p><button class="btn" data-a="dbx-recheck">Noch einmal versuchen</button>`;
    else if (UI.remote.text) body = `<h2>Schritt 2: Passwort eingeben</h2><p>In deiner Dropbox liegen schon Daten von einem anderen Gerät. Gib dasselbe Passwort ein wie dort.${localIsEmpty() ? "" : " Was auf diesem Gerät schon eingetragen ist, wird mit übernommen."}</p>
      <form class="form" data-f="dbx-pw"><label>Passwort<input type="password" id="pw1" autocomplete="current-password" required></label><div><button class="btn primary" type="submit">Abgleichen</button></div></form>`;
    else body = `<h2>Schritt 2: Passwort festlegen</h2><p>Mit diesem Passwort werden deine Daten verschlüsselt. Du brauchst es auf jedem weiteren Gerät. <b>Schreib es dir auf.</b> Wenn es verloren geht, kann niemand die Daten in der Dropbox wiederherstellen. Auf deinen Geräten bleiben sie aber erhalten.</p>
      <form class="form" data-f="dbx-pw"><label>Passwort (mindestens 8 Zeichen)<input type="password" id="pw1" autocomplete="new-password" required></label><label>Passwort wiederholen<input type="password" id="pw2" autocomplete="new-password" required></label><div><button class="btn primary" type="submit">Verschlüsselung einrichten</button></div></form>`;
  } else {
    const err = SYNC.state === "err" ? `<p class="note" style="margin:0 0 10px">${esc(SYNC.msg)}</p>` : "";
    body = `<h2>Abgleich ist eingerichtet</h2>${err}<p>${SYNC.state === "run" ? "Gleicht gerade ab …" : esc(syncLabel())}</p>
      <div class="ctrl"><button class="btn primary" data-a="sync-now">Jetzt abgleichen</button>${confirmBtn("dbx-off", "Dieses Gerät trennen", "dbx-off")}</div>
      <p class="small muted">Trennen beendet nur den Abgleich auf diesem Gerät. Deine Einträge bleiben hier und in der Dropbox erhalten.</p>`;
  }
  return head + `<div class="stack">${intro}<section class="card">${body}</section></div>`;
}

/* ---------------------------------------------------------- Rendern & Ereignisse */
function render() {
  renderNav();
  const v = UI.view;
  $("main").innerHTML = v === "heute" ? renderHeute() : v === "woche" ? renderWoche() : v === "kalender" ? renderKalender() : v === "klassen" ? renderKlassen() : renderMehr();
}
function go(view, keepScroll) {
  UI.view = view; UI.confirm = null;
  try { history.replaceState(null, "", "#" + view); } catch (e) {}
  render(); if (!keepScroll) window.scrollTo(0, 0);
}
function rerender() { const y = window.scrollY, f = document.activeElement && document.activeElement.id; render(); window.scrollTo(0, y); if (f && $(f)) $(f).focus({ preventScroll: true }); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, k = UI.kid && S.klassen[UI.kid];
  if (a !== "ask" && a !== "cancel") UI.confirm = UI.confirm && ["imp", "reset"].includes(a) ? UI.confirm : null;
  switch (a) {
    case "view": if (b.dataset.v === "klassen" && UI.view === "klassen") UI.kid = null; if (b.dataset.v === "mehr" && UI.view === "mehr") UI.mehr = null; go(b.dataset.v); break;
    case "day": UI.sel = add(UI.sel, +b.dataset.n); rerender(); break;
    case "week": UI.sel = add(UI.sel, +b.dataset.n); rerender(); break;
    case "today": UI.sel = todayIso(); rerender(); break;
    case "go": UI.sel = b.dataset.d; go("heute"); break;
    case "anw": UI.kid = b.dataset.k; UI.ktab = "anw"; UI.anwDate = UI.sel; go("klassen"); break;
    case "auf-del": day(UI.sel).auf.splice(+b.dataset.i, 1); save(); rerender(); break;
    case "kl": UI.kid = b.dataset.k || null; UI.ktab = "schueler"; go("klassen"); break;
    case "ktab": UI.ktab = b.dataset.t; rerender(); break;
    case "ask": UI.confirm = b.dataset.q; rerender(); break;
    case "cancel": UI.confirm = null; rerender(); break;
    case "s-del": { const sid = b.dataset.s; delete k.s[sid]; k.sOrder = k.sOrder.filter(x => x !== sid); UI.confirm = null; save(); rerender(); break; }
    case "l-del": { const l = b.dataset.l; delete k.leist[l]; delete k.noten[l]; k.lOrder = k.lOrder.filter(x => x !== l); save(); rerender(); break; }
    case "k-del": delete S.klassen[UI.kid]; S.kOrder = S.kOrder.filter(x => x !== UI.kid);
      for (const p in S.plan) if (S.plan[p].kid === UI.kid) S.plan[p].kid = ""; UI.kid = null; UI.confirm = null; save(); go("klassen"); toast("Klasse gelöscht"); break;
    case "anw-cycle": { const d = UI.anwDate, sid = b.dataset.s, f = (k.fehl[d] ||= {}); const nx = { "": "e", e: "u", u: "v", v: "" }[f[sid] || ""];
      if (nx) f[sid] = nx; else delete f[sid]; if (!Object.keys(f).length) delete k.fehl[d]; save(); rerender(); break; }
    case "anw-day": UI.anwDate = add(UI.anwDate, +b.dataset.n); rerender(); break;
    case "mehr": UI.mehr = b.dataset.m || null; go("mehr"); break;
    case "pday": UI.planDay = +b.dataset.w; rerender(); break;
    case "exp": UI.export = JSON.stringify(S); rerender(); break;
    case "copy": { const t = $("exp"); const done = () => toast("Kopiert");
      if (navigator.clipboard) navigator.clipboard.writeText(UI.export).then(done, () => { t.select(); toast("Text markiert, bitte selbst kopieren"); });
      else { t.select(); toast("Text markiert, bitte selbst kopieren"); } break; }
    case "dl": { const a2 = document.createElement("a"); a2.href = URL.createObjectURL(new Blob([UI.export], { type: "application/json" }));
      a2.download = "lehrerplaner-sicherung-" + todayIso() + ".json"; a2.click(); break; }
    case "imp": {
      const txt = ($("imp").value || "").trim(); UI.confirm = null;
      const apply = raw => { try { const o = JSON.parse(raw); if (!o || o.v !== 1 || !o.klassen) throw 0; S = Object.assign(blank(), o); save(); toast("Sicherung eingespielt"); UI.mehr = null; go("heute"); }
        catch (err) { toast("Das ist keine gültige Sicherung"); rerender(); } };
      const file = $("imp-file").files[0];
      if (file) file.text().then(apply); else if (txt) apply(txt); else { toast("Bitte Datei wählen oder Text einfügen"); rerender(); }
      break; }
    case "dbx-login": dbxLogin(); break;
    case "dbx-recheck": UI.remote = null; rerender(); break;
    case "sync-now": SYNC.state = "run"; rerender(); sync(); break;
    case "dbx-off": SY = { appKey: SY.appKey }; persistSync(); UI.remote = null; SYNC.state = "idle"; toast("Abgleich auf diesem Gerät beendet"); rerender(); break;
    case "reset": S = blank(); UI.confirm = null; UI.kid = null; save(); toast("Neu begonnen"); render(); break;
  }
});

document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-f]"); if (!f) return; e.preventDefault();
  const k = UI.kid && S.klassen[UI.kid];
  switch (f.dataset.f) {
    case "auf-add": { const v = $("auf-new").value.trim(); if (!v) return; day(UI.sel).auf.push({ t: v, done: false }); save(); rerender(); $("auf-new").focus(); break; }
    case "kl-add": { const n = $("kl-name").value.trim(); if (!n) return; const id = uid("k"); S.klassen[id] = newKlasse(n, $("kl-fach").value.trim()); S.kOrder.push(id); save(); UI.kid = id; UI.ktab = "schueler"; go("klassen"); break; }
    case "s-add": { const names = $("s-new").value.split(/\r?\n/).map(x => x.trim()).filter(Boolean); names.forEach(n => { const sid = uid("s"); k.s[sid] = { name: n, notiz: "" }; k.sOrder.push(sid); }); save(); rerender(); if (names.length) toast(names.length + (names.length === 1 ? " Name" : " Namen") + " hinzugefügt"); break; }
    case "dbx-key": { const v = $("dbx-key").value.trim(); if (!v) return; SY.appKey = v; persistSync(); rerender(); break; }
    case "dbx-pw": { const b = f.querySelector("button"); b.disabled = true; setPassword($("pw1").value, $("pw2") ? $("pw2").value : "").finally(() => { if (b.isConnected) b.disabled = false; }); break; }
    case "l-add": { const t = $("l-t").value.trim(); if (!t) return; const l = uid("l"); k.leist[l] = { titel: t, datum: $("l-d").value, gew: $("l-g").value }; k.lOrder.push(l); k.noten[l] = {}; save(); rerender(); break; }
  }
});

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.u) { if (el.value) { UI[el.dataset.u] = el.value; rerender(); } return; }
  if (!el.dataset.p) return;
  setPath(el.dataset.p, el.type === "checkbox" ? el.checked : el.value);
  saveSoon();
  const after = el.dataset.after, k = UI.kid && S.klassen[UI.kid];
  if (after === "rerender") { save(); rerender(); }
  else if (after === "avg" && k) {
    const [, , , l, sid] = el.dataset.p.split("|");
    $("avg-" + sid).textContent = fmtAvg(studentAvg(k, sid));
    $("lavg-" + l).textContent = fmtAvg(leistAvg(k, l));
    $("kavg").textContent = fmtAvg(klasseAvg(k));
    el.style.color = el.value && gval(el.value) == null ? "var(--warn)" : "";
  } else if (after === "planfach") {
    const [, key] = el.dataset.p.split("|"), e2 = S.plan[key], kl = S.klassen[e2.kid];
    if (kl && !e2.fach) { e2.fach = kl.fach; const inp = $("pf-" + key); if (inp) inp.value = kl.fach; }
  }
});

load();
stamp();
const q0 = new URLSearchParams(location.search);
if (q0.get("code") || q0.get("error")) {
  try { history.replaceState(null, "", redirectUri() + "#mehr"); } catch (e) {}
  UI.view = "mehr"; UI.mehr = "sync";
  if (q0.get("code")) dbxFinish(q0.get("code"), q0.get("state")).then(() => rerender(), e => { toast(e.message); rerender(); });
  else toast("Verbindung mit Dropbox abgebrochen");
}
const h0 = (location.hash || "").slice(1);
if (VIEWS.some(v => v[0] === h0) && !UI.mehr) UI.view = h0;
render();
syncSoon(500);
if ("serviceWorker" in navigator && window.self === window.top && (location.protocol === "https:" || location.hostname === "localhost")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
